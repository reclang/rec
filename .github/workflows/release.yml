# Release: an annotated tag vX.Y.Z pushed to GitHub builds the release
# assets and publishes them as a GitHub release.
#
#   reclang-X.Y.Z.tar.gz                source, git archive
#   reclang-X.Y.Z-linux-x86_64.tar.gz   reclang, reclang.1, LICENSE in one
#                                       directory; D runtime linked in,
#                                       needs glibc 2.35 (Ubuntu 22.04) or newer
#   reclang-X.Y.Z-macos-arm64.tar.gz    the same three files for Apple Silicon,
#                                       ad-hoc signed by the linker, macOS 12
#                                       or newer
#   SHA256SUMS                          sha256sum of the tarballs; install.sh
#                                       reads it
#
# The tag must be the version value fron the VERSION file with a v in front,
# i.e., "1.0.0" in the VERSION file and "v1.0.0" tag;
# body becomes the release notes, without the changelog heading, which the
# release title "Rec X.Y.Z" replaces. Dry run with act, publishing skipped:
#
#   printf '{"ref":"refs/tags/v%s"}\n' "$(cat VERSION)" > /tmp/tag.json
#   act push -e /tmp/tag.json --artifact-server-path /tmp/act-artifacts

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  LDC_VERSION: 1.43.0

jobs:
  version:
    name: tag matches VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # checkout leaves a lightweight copy of the tag at the commit
      # (actions/checkout#290); the annotation check needs the tag object
      - name: Fetch the tag object
        run: |
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" \
            || echo "tag $GITHUB_REF_NAME not fetched (dry run)"
      - id: check
        run: |
          version=${GITHUB_REF_NAME#v}
          file=$(cat VERSION)
          if [ "$version" != "$file" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION file: $file"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$GITHUB_REF_NAME^{tag}" > /dev/null 2>&1; then
            echo "annotated tag $GITHUB_REF_NAME, version $version"
          elif git rev-parse -q --verify "refs/tags/$GITHUB_REF_NAME" > /dev/null; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; release tags are annotated"
            exit 1
          else
            echo "tag $GITHUB_REF_NAME is not in this checkout (dry run); annotation not checked"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-x86_64:
    name: build linux-x86_64
    needs: version
    runs-on: ubuntu-latest
    # Link on the oldest glibc the binary must run on: 2.35 in Ubuntu 22.04,
    # older than Debian 12's 2.36. Its distro ldc is below the 1.36 floor, so
    # the compiler comes from the upstream tarball instead.
    container: ubuntu:22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: linux-x86_64
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils git build-essential
      - uses: actions/checkout@v5
      - name: Install ldc ${{ env.LDC_VERSION }}
        run: |
          curl -fsSL "https://github.com/ldc-developers/ldc/releases/download/v$LDC_VERSION/ldc2-$LDC_VERSION-linux-x86_64.tar.xz" \
            | tar -xJ -C /opt
          echo "/opt/ldc2-$LDC_VERSION-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build
        run: make DFLAGS="-O -release -link-defaultlib-shared=false"
      - name: Check
        run: make check
      - name: Inspect linking
        run: |
          ldd reclang
          if ldd reclang | grep -Eq 'phobos|druntime'; then
            echo "::error::the D runtime is linked dynamically"
            exit 1
          fi
          echo "needs $(objdump -T reclang | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"
      - name: Pack
        run: |
          dir=reclang-$VERSION-$TARGET
          mkdir "$dir"
          cp reclang doc/reclang.1 LICENSE "$dir"
          tar --owner=0 --group=0 --numeric-owner -czf "$dir.tar.gz" "$dir"
          tar -tzvf "$dir.tar.gz"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.TARGET }}
          path: reclang-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz
          if-no-files-found: error

  macos-arm64:
    name: build macos-arm64
    needs: version
    runs-on: macos-latest
    # The runner is Apple Silicon and "container:" does not exist on macOS, so
    # the job runs on the VM and takes ldc from setup-dlang, the same version
    # the Linux job unpacks. The asset is named macos-arm64, not
    # macos-aarch64: install.sh builds the platform string from `uname -m`,
    # which prints arm64 here, while the compiler spells the target
    # aarch64-macos. MACOSX_DEPLOYMENT_TARGET is pinned, or the binary carries
    # whatever SDK minimum the runner image ships and refuses to start on
    # older macOS.
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: macos-arm64
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-${{ env.LDC_VERSION }}
      - name: Compiler
        run: $DC --version
      - name: Build
        run: make DFLAGS="-O -release -link-defaultlib-shared=false"
      - name: Check
        run: make check
      - name: Inspect linking
        run: |
          otool -L reclang
          if otool -L reclang | grep -Eq 'phobos|druntime'; then
            echo "::error::the D runtime is linked dynamically"
            exit 1
          fi
          # libSystem is always dynamic: macOS ships no static libc
          otool -l reclang | grep -A 4 -m 1 LC_BUILD_VERSION || true
          # the linker ad-hoc signs arm64 binaries; without a valid signature
          # macOS kills them on launch, so the shipped file is checked here
          codesign --verify --strict --verbose=2 reclang
      - name: Pack
        # bsdtar, not GNU tar: different flags for the same normalisation.
        # COPYFILE_DISABLE keeps it from adding ._ AppleDouble entries.
        env:
          COPYFILE_DISABLE: '1'
        run: |
          dir=reclang-$VERSION-$TARGET
          mkdir "$dir"
          cp reclang doc/reclang.1 LICENSE "$dir"
          tar --uid 0 --gid 0 --uname '' --gname '' -czf "$dir.tar.gz" "$dir"
          tar -tzvf "$dir.tar.gz"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.TARGET }}
          path: reclang-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz
          if-no-files-found: error

  release:
    name: publish
    needs: [version, linux-x86_64, macos-arm64]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # same as above: the tag body is the release notes
      - name: Fetch the tag object
        run: |
          git fetch --force --no-tags origin "refs/tags/v$VERSION:refs/tags/v$VERSION" \
            || echo "tag v$VERSION not fetched (dry run)"
      - name: Source tarball
        run: |
          mkdir dist
          ref=refs/tags/v$VERSION
          git rev-parse -q --verify "$ref" > /dev/null || ref=HEAD    # dry run
          git archive --prefix="reclang-$VERSION/" -o "dist/reclang-$VERSION.tar.gz" "$ref"
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum reclang-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # drop the "## [X.Y.Z] - date" heading and the blank lines after it
          git tag -l --format='%(contents:body)' "v$VERSION" \
            | awk 'NR == 1 && /^## \[/ { skip = 1; next }
                   skip && /^[[:space:]]*$/ { next }
                   { skip = 0; print }' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::tag v$VERSION has no body; the release notes would be empty"
            exit 1
          fi
          gh release create "v$VERSION" --verify-tag --title "Rec $VERSION" \
            --notes-file notes.md dist/*
